name: Fix Fullscreen + Mirror Respawn

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply fullscreen + mirror patches
        run: python3 tools/fix_fullscreen_mirror.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: true fullscreen layout + mirror auto-respawn in 2s"
            git push
          fi

name: UX Patch Game

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply UX patches
        run: python3 tools/ux_patch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server.js
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: UX patch - map size, mirror respawn, touch UI, powerups"
            git push
          fi

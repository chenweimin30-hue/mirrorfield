name: Apply Latest Game Files
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct files from chunks
        run: |
          set -e
          python3 - << 'EOF'
          import base64
          from pathlib import Path
          def join(prefix, out):
              parts = sorted(Path('tools/upload-chunks').glob(f'{prefix}_*.b64'))
              assert parts, f'no parts for {prefix}'
              b64 = ''.join(p.read_text().strip() for p in parts)
              data = base64.b64decode(b64)
              Path(out).write_bytes(data)
              print(out, len(data))
          join('index', 'index.html')
          join('server', 'server.js')
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server.js
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "feat: map size options + mirror respawn + touch UI + more powerups"
            git push
          fi

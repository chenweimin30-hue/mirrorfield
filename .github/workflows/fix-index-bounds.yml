name: Fix index.html bounds

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore index.html from last good commit and patch bounds
        run: |
          set -e
          GOOD=b3d9c5a8816a53d25c8d092df9db9a9ebca30626
          curl -fsSL "https://raw.githubusercontent.com/chenweimin30-hue/mirrorfield/${GOOD}/index.html" -o index.html
          # 1) cover -> contain，整张地图始终可见
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t2 = t.replace(
            'const scale = Math.max(r.width / W, r.height / H);',
            'const scale = Math.min(r.width / W, r.height / H);',
            1,
          )
          old = '''  if (l > 0.01) {\n    netMe.x += inp.x / Math.max(l, 1) * 3.3;\n    netMe.y += inp.y / Math.max(l, 1) * 3.3;\n    pushOutOfMirrors(netMe);\n  }'''
          new = '''  if (l > 0.01) {\n    netMe.x += inp.x / Math.max(l, 1) * 3.3;\n    netMe.y += inp.y / Math.max(l, 1) * 3.3;\n  }\n  pushOutOfMirrors(netMe);'''
          if old in t2:
            t2 = t2.replace(old, new, 1)
          assert 'Math.min(r.width / W, r.height / H)' in t2
          assert 'function loop' in t2
          p.write_text(t2, encoding='utf-8')
          print('index.html restored+patched, size', p.stat().st_size)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: 恢复 index.html 并禁止角色跑出可视区域"
          git push

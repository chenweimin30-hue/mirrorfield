<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2e3b2a">
<link rel="manifest" href="manifest.json">
<title>镜原 Mirrorfield · 联机版</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#2e3b2a;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
            overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;background:#7cb342;touch-action:none;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
           border-radius:10px;color:#fff;background:rgba(20,32,18,.78);backdrop-filter:blur(3px);cursor:default;z-index:5;padding:16px;box-sizing:border-box;overflow:auto;}
  .hidden{display:none !important;}
  h1{font-size:min(44px,9vw);margin:0 0 6px;letter-spacing:6px;text-shadow:0 3px 12px rgba(0,0,0,.6);}
  h1 small{display:block;font-size:15px;letter-spacing:3px;opacity:.75;font-weight:400;margin-top:6px;}
  .desc{font-size:min(15px,3.4vw);line-height:1.9;opacity:.9;margin:14px 0 20px;max-width:520px;}
  .keys{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;
        padding:12px 20px;font-size:min(14px,3.2vw);line-height:2;margin-bottom:22px;}
  .keys b{background:rgba(255,255,255,.16);border-radius:5px;padding:2px 8px;margin:0 2px;font-weight:600;}
  button{font-size:min(19px,4.5vw);padding:12px 46px;border:none;border-radius:30px;
         background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;cursor:pointer;letter-spacing:2px;
         box-shadow:0 4px 18px rgba(76,175,80,.45);transition:transform .12s;}
  button:hover{transform:scale(1.06);}
  .stat{font-size:17px;line-height:2;margin-bottom:18px;}
  .stat span{color:#ffd54f;font-weight:700;font-size:24px;margin:0 4px;}
  .tip{margin-top:14px;font-size:12px;opacity:.7;}
  #status{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;
          background:rgba(0,0,0,.55);color:#fff;padding:6px 16px;border-radius:18px;font-size:13px;
          display:none;pointer-events:none;}
  #lobbyList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;margin:10px 0 18px;}
  #lobbyList .pchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);
                    border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-size:13px;}
  #lobbyList .pchip.me{border-color:#66bb6a;background:rgba(102,187,106,.25);}
  #lobbyList .pchip i{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;opacity:.85;margin-top:8px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);
               border-radius:12px;padding:4px 10px;}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
  input[type=text]{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.3);
             background:rgba(255,255,255,.1);color:#fff;outline:none;text-align:center;margin-bottom:18px;width:200px;}
  #boardTable{width:100%;max-width:360px;border-collapse:collapse;font-size:14px;margin:10px 0 18px;}
  #boardTable th,#boardTable td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;}
  #boardTable th{opacity:.7;font-weight:500;}
  #boardTable tr.me td{color:#ffd54f;font-weight:600;}
  .secondary-btn{margin-top:14px;background:linear-gradient(135deg,#26c6da,#00838f);
                 box-shadow:0 4px 18px rgba(0,172,193,.35);}
  #disconnect{position:absolute;inset:0;z-index:30;display:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="status"></div>
    <div class="overlay" id="menu">
      <h1>镜原 <small>Mirrorfield · 联机版</small></h1>
      <div class="desc">草原上竖立无数面镜子，在镜林中找到对方并开击。<br>子弹会沿镜面 45° 反弹。<br>支持最多 10 名真实玩家同房实时对战。</div>
      <div class="keys">
        <b>WASD</b> 移动 &nbsp; <b>鼠标</b> 瞄准 &nbsp; <b>空格/左键</b> 射击<br>
        <b>Shift</b> 冲刺 &nbsp; 手机：左摇杆移动 · 右键射击
      </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:0 0 14px;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:8px 16px;max-width:92%;"><span>地图</span><label style="cursor:pointer"><input type="radio" name="mapSize" value="screen" checked> 屏幕大小</label><label style="cursor:pointer"><input type="radio" name="mapSize" value="medium"> 中等</label><label style="cursor:pointer"><input type="radio" name="mapSize" value="large"> 超大</label></div>
<button id="btnSolo">单机闯关</button>
      <button id="btnNet" class="secondary-btn">加入联机房间</button>
      <div class="legend">
        <span><i style="background:#42a5f5"></i>你</span>
        <span><i style="background:#ef5350"></i>敌人</span>
        <span><i style="background:#ffeb3b"></i>子弹</span>
        <span><i style="background:#90a4ae"></i>镜子</span>
      </div>
    </div>
    <div class="overlay hidden" id="over">
      <h1 id="overTitle">本局结束</h1>
      <div class="stat" id="overStat"></div>
      <table id="boardTable"></table>
      <button id="btnAgain">再来一局</button>
      <button id="btnExit" class="secondary-btn" style="margin-top:12px;">返回菜单</button>
      <div class="tip" id="nextRoundTip"></div>
    </div>
    <div class="overlay hidden" id="disconnect">
      <h1>连接已断开</h1>
      <div class="desc">与服务器的连接丢失，请刷新页面重新进入。</div>
      <button onclick="location.reload()">刷新页面</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= 镜原 Mirrorfield · 联机版客户端 =================
   单文件：本地单人模式保留 + 联机模式（WebSocket）
   本地模拟与服务器端逻辑保持一致（镜像反射/道具/连击）
=====================================================================*/

let W = 960, H = 640, HEDGE = 18;
let mapSizeMode = 'screen';
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
let viewW = 960, viewH = 640;           // 可视窗口（逻辑像素）
let camX = 0, camY = 0;                 // 镜头左上角（世界坐标）
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

// 自适应画布：保持 960x640 逻辑坐标，letterbox 填满 stage
function fit() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  // 可视区域高度固定 640 逻辑像素，宽度按屏幕比例延伸（贪吃蛇式镜头）
  viewH = 640;
  viewW = Math.max(480, viewH * (r.width / Math.max(r.height, 1)));
  window.__sx = (r.width * dpr) / viewW;
  window.__sy = (r.height * dpr) / viewH;
  window.__scale = r.height / viewH;
  window.__offX = 0; window.__offY = 0;
  applyCameraTransform();
}
function updateCamera(px, py) {
  camX = px - viewW / 2;
  camY = py - viewH / 2;
  camX = clamp(camX, 0, Math.max(0, W - viewW));
  camY = clamp(camY, 0, Math.max(0, H - viewH));
}
function applyCameraTransform() {
  const sx = window.__sx || 1, sy = window.__sy || 1;
  ctx.setTransform(sx, 0, 0, sy, -camX * sx, -camY * sy);
}
function screenToWorld(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) / Math.max(r.width, 1) * viewW + camX,
    y: (clientY - r.top) / Math.max(r.height, 1) * viewH + camY
  };
}
function touchScreen(t) {
  const r = cv.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top, rw: r.width, rh: r.height };
}

function applyMapSize() {
  const sel = document.querySelector('input[name="mapSize"]:checked');
  mapSizeMode = (sel && sel.value) || 'screen';
  if (mapSizeMode === 'screen') { W = Math.round(viewW || 960); H = Math.round(viewH || 640); }
  else if (mapSizeMode === 'medium') { W = 1600; H = 1066; }
  else { W = 2560; H = 1706; }
  if (typeof paintGround === 'function') paintGround();
}
window.addEventListener('resize', fit);

/* ---------- 工具 ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function closestOnSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy || 1e-9;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / L2, 0, 1);
  return { x: x1 + t * dx, y: y1 + t * dy };
}
function raySegment(px, py, dx, dy, x1, y1, x2, y2) {
  const ex = x2 - x1, ey = y2 - y1, fx = x1 - px, fy = y1 - py;
  const den = ex * dy - dx * ey;
  if (Math.abs(den) < 1e-9) return -1;
  const t = (ex * fy - fx * ey) / den, u = (dx * fy - fx * dy) / den;
  return (t > 0.001 && u >= 0 && u <= 1) ? t : -1;
}
function reflect(vx, vy, m) { return m.type === '/' ? { x: -vy, y: -vx } : { x: vy, y: vx }; }

/* ---------- 音效 ---------- */
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function beep(freq, dur, type, vol, slide) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  if (slide) o.frequency.linearRampToValueAtTime(slide, audioCtx.currentTime + dur);
  g.gain.value = vol || .1; g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur + .02);
}

/* ---------- 状态 ---------- */
let state = 'menu'; // menu | lobby | countdown | playing | paused | results
let mode = 'solo'; // solo | net
let mirrors = [], bullets = [], particles = [], floats = [], powerups = [];
let player = null, enemies = [], level = 1, threat = 1, kills = 0, score = 0, combo = 0, comboT = 0;
let surviveT = 0, hurtFlash = 0, graceT = 0, spawnT = 0;
let countdownLeft = 0, roundLeft = 0, lobbyWait = 0;
let mirrorBreakable = true;
const mouse = { x: W / 2, y: H / 2, down: false };
const keys = {};
let touchInput = { active: false, mx: 0, my: 0, ax: 0, ay: 0, fire: false, aimActive: false, dashReq: false };
let netMe = null;                                 // 联机：本地预测的自己
let netPlayers = new Map();
let myId = null, ws = null, wsReady = false;
let snapPrev = null, snapCur = null, snapTime = 0;

/* ---------- 网络 ---------- */
function wsConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try { ws = new WebSocket(proto + '//' + location.host); }
  catch (e) { showStatus('无法建立连接，已切换单机模式', 3000); return; }
  ws.onopen = () => { wsReady = true; ws.send(JSON.stringify({ t: 'join' })); };
  ws.onclose = () => {
    wsReady = false;
    if (mode === 'net') {
      document.getElementById('disconnect').classList.remove('hidden');
      document.getElementById('menu').classList.add('hidden');
    }
  };
  ws.onerror = () => {};
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    onNet(m);
  };
}
function netSend(obj) { if (wsReady && ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onNet(m) {
  switch (m.t) {
    case 'welcome': myId = m.id; break;
    case 'full': showStatus('房间已满（10人）', 4000); break;
    case 'join':
      if (m.id !== myId) showStatus(m.name + ' 加入了镜林', 2200);
      break;
    case 'mirror-setting':
      mirrorBreakable = !!m.mirrorBreakable;
      break;
    case 'phase':
      if (m.phase === 'countdown') {
        state = 'countdown'; countdownLeft = (m.end - Date.now()) / 1000;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('over').classList.add('hidden');
      } else if (m.phase === 'playing') {
        state = 'playing';
        roundLeft = m.end - Date.now();
      } else if (m.phase === 'results') {
        // handled by results message
      } else if (m.phase === 'lobby') {
        state = 'lobby';
      }
      break;
    case 'snapshot':
      snapPrev = snapCur; snapCur = m; snapTime = performance.now();
      if (m.mirrors) mirrors = m.mirrors;
      break;
    case 'shatter': showStatus('一面镜子碎裂了！', 1200); break;
    case 'kill':
      if (m.victim === myId) { hurtFlash = 1; beep(300, .4, 'sawtooth', .16, 70); }
      else if (m.killer === myId) {
        initAudio();
        if (m.bounces > 0) { score += 50 * m.bounces; floats.push({ x: W/2, y: 150, txt: '镜杀 +' + (50*m.bounces), life: 80, color: '#4fc3f7' }); }
        beep(760, .3, 'square', .15, 200);
      }
      break;
    case 'respawn':
      if (m.id === myId) { hurtFlash = .5; }
      break;
    case 'pickup':
      if (m.by === myId) beep(980, .12, 'sine', .13, 1400);
      break;
    case 'results': showResults(m.board); break;
    case 'lobby':
      state = 'lobby';
      document.getElementById('over').classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
      break;
    case 'mirrorfield':
      mirrors = m.mirrors || [];
      break;
  }
}

/* ---------- 大厅 UI ---------- */
function renderLobby(players) {
  const el = document.getElementById('lobbyList');
  if (!el) return;
  el.innerHTML = '';
  const count = document.createElement('div');
  count.style.cssText = 'width:100%;text-align:center;font-size:14px;opacity:.85;margin-bottom:6px;';
  count.textContent = '当前镜林中的玩家：' + players.length + ' / 10';
  el.appendChild(count);
  for (const p of players) {
    const chip = document.createElement('div');
    chip.className = 'pchip' + (p.id === myId ? ' me' : '');
    chip.innerHTML = '<i style="background:' + p.color + '"></i>' + (p.id === myId ? '你' : p.name);
    el.appendChild(chip);
  }
  const tip = document.getElementById('waitTip');
  if (tip) {
    if (players.length < 2) tip.textContent = '等待更多玩家……（1 人时为单机练习，2 人即自动开始）';
    else if (lobbyWait > 0) tip.textContent = '对局即将开始：' + Math.ceil(lobbyWait / 1000) + ' 秒';
    else tip.textContent = '';
  }
}
function showStatus(txt, ms) {
  const el = document.getElementById('status');
  el.textContent = txt; el.style.display = 'block';
  clearTimeout(el.__t);
  el.__t = setTimeout(() => { el.style.display = 'none'; }, ms || 2000);
}
function showResults(board) {
  state = 'results';
  const tbl = document.getElementById('boardTable');
  let html = '<tr><th>#</th><th>玩家</th><th>击杀</th><th>死亡</th><th>积分</th></tr>';
  board.forEach((p, i) => {
    html += '<tr' + (p.id === myId ? ' class="me"' : '') + '><td>' + (i+1) + '</td><td>' + (p.name || '?') + '</td><td>' + p.kills + '</td><td>' + p.deaths + '</td><td>' + p.score + '</td></tr>';
  });
  tbl.innerHTML = html;
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('menu').classList.add('hidden');
}

/* ---------- 镜子生成 ---------- */
function makeMirror(cx, cy, len, type) {
  const s = len / 2 * Math.SQRT1_2;
  const dx = s, dy = type === '/' ? -s : s;
  return { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, type, hp: 3 };
}
function genMirrors() {
  mirrors = [];
  const areaRatio = (W * H) / (960 * 640); const n = Math.max(10, Math.round(16 * areaRatio) + Math.floor(Math.random() * 6));
  let tries = 0;
  while (mirrors.length < n && tries < 1200) {
    tries++;
    const cx = rnd(HEDGE + 70, W - HEDGE - 70), cy = rnd(HEDGE + 70, H - HEDGE - 70);
    if (dist2(cx, cy, 100, 100) < 110 * 110) continue;
    if (dist2(cx, cy, W - 100, H - 100) < 110 * 110) continue;
    let ok = true;
    for (const m of mirrors) {
      const mx = (m.x1 + m.x2) / 2, my = (m.y1 + m.y2) / 2;
      if (dist2(cx, cy, mx, my) < 105 * 105) { ok = false; break; }
    }
    if (!ok) continue;
    mirrors.push(makeMirror(cx, cy, rnd(70, 130), Math.random() < .5 ? '/' : '\\'));
  }
}

function resetGame() {
  if (typeof applyMapSize==='function') applyMapSize();
  if (typeof applyMapSize==='function') applyMapSize();
  genMirrors();
  player = { x: 100, y: 100, r: 14, hp: 100, aim: 0, cool: 0, speed: 3.3, inv: 0,
             dashCd: 0, dashT: 0, dashDx: 0, dashDy: 0, triT: 0, shieldT: 0, pierceT: 0, rapidT: 0 };
  enemies = [];
  startLevel(1);
  bullets = []; particles = []; floats = []; powerups = [];
  kills = 0; surviveT = 0; hurtFlash = 0; graceT = 3;
  combo = 0; comboT = 0; score = 0; spawnT = 1.2;
}

function makeCampaignEnemy(index, count) {
  const angle = (index / count) * Math.PI * 2 + rnd(-.12, .12);
  const radius = rnd(380, 620);
  let x = W / 2 + Math.cos(angle) * radius;
  let y = H / 2 + Math.sin(angle) * radius * .62;
  x = clamp(x, HEDGE + 45, W - HEDGE - 45);
  y = clamp(y, HEDGE + 45, H - HEDGE - 45);
  return {
    x, y, r: 14, hp: Math.min(180, 80 + level * 5), aim: 0,
    cool: rnd(.9, 1.8), speed: 0, alive: true, mode: 'wander',
    modeT: rnd(.8, 2), tx: W / 2, ty: H / 2, gunFlash: 0, hitT: 0
  };
}

function startLevel(nextLevel) {
  level = nextLevel;
  threat = level;
  const count = Math.min(20, level);
  enemies = Array.from({ length: count }, (_, index) => makeCampaignEnemy(index, count));
  graceT = 3;
  const levelText = '第 ' + level + ' 关 · ' + count + ' 名敌人';
  floats.push({ x: W / 2, y: 120, txt: levelText,
                life: 120, color: '#ffd54f' });
  beep(620, .18, 'sine', .12, 880);
}

function completeLevel() {
  const bonus = 500 + level * 100;
  score += bonus;
  player.hp = 100;
  player.triT = 0; player.shieldT = 0; player.pierceT = 0; player.rapidT = 0;
  bullets = [];
  powerups = [];
  spark(player.x, player.y, '#ffd54f', 32, 300);
  floats.push({ x: W / 2, y: 160, txt: '关卡完成 +' + bonus, life: 120, color: '#66bb6a' });
  beep(880, .25, 'square', .14, 1320);
  startLevel(Math.min(20, level + 1));
}


function shatterMirror(m, cx, cy) {
  m.hp = 0; m.broken = true; m.respawnAt = performance.now() + 2000;
  if (typeof spark === 'function') spark(cx, cy, '#cfd8dc', 16, 220);
  if (typeof beep === 'function') beep(500, .18, 'sawtooth', .12, 140);
}
function updateMirrorsLocal() {
  const now = performance.now();
  for (const m of mirrors) {
    if (m.broken && now >= m.respawnAt) {
      m.hp = 3; m.broken = false;
      if (typeof spark === 'function') spark((m.x1+m.x2)/2, (m.y1+m.y2)/2, '#90caf9', 10, 160);
    }
  }
}
const MIRROR_HALF = 4;
function pushOutOfMirrors(o) {
  for (const m of mirrors) {
    if (m.broken) continue;
    const c = closestOnSeg(o.x, o.y, m.x1, m.y1, m.x2, m.y2);
    const d = Math.hypot(o.x - c.x, o.y - c.y), min = o.r + MIRROR_HALF;
    if (d < min) {
      if (d < 1e-4) { o.x += min; continue; }
      o.x = c.x + (o.x - c.x) / d * min;
      o.y = c.y + (o.y - c.y) / d * min;
    }
  }
  o.x = clamp(o.x, HEDGE + o.r, W - HEDGE - o.r);
  o.y = clamp(o.y, HEDGE + o.r, H - HEDGE - o.r);
}
function rayBorderT(x, y, dx, dy) {
  let t = 1e9;
  if (dx > 1e-9) t = Math.min(t, (W - HEDGE - x) / dx);
  if (dx < -1e-9) t = Math.min(t, (HEDGE + 4 - x) / dx);
  if (dy > 1e-9) t = Math.min(t, (H - HEDGE - y) / dy);
  if (dy < -1e-9) t = Math.min(t, (HEDGE + 4 - y) / dy);
  return t;
}
function tracePath(px, py, dx, dy, maxBounce) {
  let x = px, y = py, vx = dx, vy = dy;
  const pts = [{ x, y }];
  for (let b = 0; b <= maxBounce; b++) {
    let bestT = rayBorderT(x, y, vx, vy), bestM = null;
    for (const m of mirrors) {
      const t = raySegment(x, y, vx, vy, m.x1, m.y1, m.x2, m.y2);
      if (t > 0 && t < bestT) { bestT = t; bestM = m; }
    }
    if (bestT > 1e8) break;
    x += vx * bestT; y += vy * bestT;
    pts.push({ x, y });
    if (!bestM) break;
    const r = reflect(vx, vy, bestM);
    vx = r.x; vy = r.y;
  }
  return pts;
}

function fire(owner, tx, ty, isPlayer) {
  const ox = owner.x, oy = owner.y;
  let dx = tx - ox, dy = ty - oy;
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;
  const sp = isPlayer ? (player.rapidT > 0 ? 11.5 : 9.5) : Math.min(8.6, 7.2 + threat * 0.2);
  const b = { x: ox, y: oy, vx: dx * sp, vy: dy * sp, r: 4.5, owner: isPlayer ? 'p' : 'e',
              life: 180, bounces: 0, trail: [], pierce: isPlayer && player.pierceT > 0 };
  bullets.push(b);
  if (isPlayer && player.triT > 0) {
    const a = Math.atan2(dy, dx);
    for (const off of [-0.18, 0.18]) {
      const aa = a + off;
      bullets.push({ x: ox, y: oy, vx: Math.cos(aa)*sp, vy: Math.sin(aa)*sp, r: 4.5, owner: 'p',
                     life: 180, bounces: 0, trail: [], pierce: player.pierceT > 0 });
    }
  }
  owner.cool = isPlayer ? (player.rapidT > 0 ? 0.18 : 0.32) : rnd(0.9, 1.6);
  owner.gunFlash = 6;
  beep(isPlayer ? 880 : 420, .06, 'square', .08);
}

function spark(x, y, color, n, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = rnd(1, 4);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, color, size: rnd(1.5, 3.5),
                     life: life || 30, max: life || 30 });
  }
}

function updatePlayerLocal() {
  if (!player || player.hp <= 0) return;
  const inp = getMoveInput();
  if (player.dashT > 0) {
    player.dashT--;
    player.x += player.dashDx * 9.5; player.y += player.dashDy * 9.5;
    spark(player.x, player.y, 'rgba(129,212,250,.8)', 2, 30);
  } else {
    const d = Math.hypot(inp.x, inp.y);
    if (d > 0.01) {
      player.x += inp.x / d * player.speed; player.y += inp.y / d * player.speed;
    }
  }
  pushOutOfMirrors(player);
  if (player.cool > 0) player.cool -= 1/60;
  if (player.inv > 0) player.inv--;
  if (player.dashCd > 0) player.dashCd--;
  if (player.triT > 0) player.triT--;
  if (player.shieldT > 0) player.shieldT--;
  if (player.pierceT > 0) player.pierceT--;
  if (player.rapidT > 0) player.rapidT--;
  const aim = getAimInput();
  if (aim) { player.aim = Math.atan2(aim.y - player.y, aim.x - player.x); mouse.x = aim.x; mouse.y = aim.y; }
  if (getFireInput() && player.cool <= 0) {
    fire(player, mouse.x, mouse.y, true);
  }
  if (inp.dash && player.dashCd <= 0 && player.dashT <= 0) {
    const d = Math.hypot(inp.x, inp.y) || 1;
    player.dashDx = inp.x / d; player.dashDy = inp.y / d;
    player.dashT = 10; player.dashCd = 90;
    player.inv = Math.max(player.inv, 10);
    beep(300, .1, 'sawtooth', .1);
  }
}

function updateEnemy(enemy) {
  if (!enemy.alive) return;
  enemy.modeT -= 1/60;
  if (enemy.cool > 0) enemy.cool -= 1/60;
  if (enemy.hitT > 0) enemy.hitT--;
  if (enemy.gunFlash > 0) enemy.gunFlash--;
  const dpx = player.x - enemy.x, dpy = player.y - enemy.y;
  const dist = Math.hypot(dpx, dpy);
  let gx = enemy.tx, gy = enemy.ty;
  if (enemy.mode === 'chase' || dist < 280) {
    gx = player.x; gy = player.y;
    if (enemy.modeT <= 0) { enemy.mode = 'wander'; enemy.modeT = rnd(1.2, 2.8); }
  } else if (enemy.modeT <= 0) {
    enemy.mode = Math.random() < .55 ? 'chase' : 'wander';
    enemy.modeT = rnd(1.5, 3.2);
    if (enemy.mode === 'wander') {
      enemy.tx = clamp(enemy.x + rnd(-220, 220), HEDGE + 40, W - HEDGE - 40);
      enemy.ty = clamp(enemy.y + rnd(-180, 180), HEDGE + 40, H - HEDGE - 40);
    }
  }
  const dx = gx - enemy.x, dy = gy - enemy.y;
  const L = Math.hypot(dx, dy) || 1;
  enemy.speed = Math.min(3.3, 1.6 + level * .07);
  enemy.x += dx / L * enemy.speed * 0.85;
  enemy.y += dy / L * enemy.speed * 0.85;
  pushOutOfMirrors(enemy);
  enemy.aim = Math.atan2(player.y - enemy.y, player.x - enemy.x);
  if (enemy.cool <= 0 && graceT <= 0) {
    let block = false;
    for (const m of mirrors) {
      const t = raySegment(enemy.x, enemy.y, Math.cos(enemy.aim), Math.sin(enemy.aim), m.x1, m.y1, m.x2, m.y2);
      if (t > 0 && t < dist) { block = true; break; }
    }
    if (!block) { fire(enemy, player.x, player.y, false); return; }
    // 尝试镜面反弹射击
    for (const m of mirrors) {
      const img = { x: 2*((m.x1+m.x2)/2) - player.x, y: 2*((m.y1+m.y2)/2) - player.y };
      // simplified
    }
    if (activeEnemyBullets < Math.min(32, 8 + level)) {
      fire(enemy, player.x, player.y, false);
      const activeCount = bullets.filter(b => b.owner === 'e').length;
      const spacing = Math.max(.55, activeCount / 4 + .25);
      enemy.cool = Math.max(.3, rnd(.8, 1.6) * spacing);
    }
  }
}

let activeEnemyBullets = 0;
function updateBullets() {
  activeEnemyBullets = 0;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.owner === 'e') activeEnemyBullets++;
    // 镜面反弹
    for (const m of mirrors) {
      const c = closestOnSeg(b.x, b.y, m.x1, m.y1, m.x2, m.y2);
      if (Math.hypot(b.x - c.x, b.y - c.y) < b.r + 3) {
        const r = reflect(b.vx, b.vy, m);
        b.vx = r.x; b.vy = r.y;
        b.bounces++;
        b.x += b.vx * 2; b.y += b.vy * 2;
        if (mirrorBreakable && m.hp > 0) {
          m.hp--;
          if (m.hp <= 0) {
            mirrors = mirrors.filter(mm => mm !== m);
            spark(c.x, c.y, '#90a4ae', 18, 40);
            beep(200, .15, 'triangle', .1);
          }
        }
        break;
      }
    }
    // 边界
    if (b.x < HEDGE || b.x > W - HEDGE || b.y < HEDGE || b.y > H - HEDGE) {
      bullets.splice(i, 1); continue;
    }
    if (b.life <= 0) { bullets.splice(i, 1); continue; }
    // 命中判定
    if (mode === 'solo') {
      if (b.owner === 'p') {
        for (const e of enemies) {
          if (!e.alive) continue;
          if (dist2(b.x, b.y, e.x, e.y) < (e.r + b.r) ** 2) {
            e.hp -= b.pierce ? 35 : 28;
            e.hitT = 8;
            spark(b.x, b.y, '#ff8a80', 10, 25);
            if (!b.pierce) bullets.splice(i, 1);
            if (e.hp <= 0) {
              e.alive = false;
              kills++;
              combo++; comboT = 3;
              score += 100 + combo * 20;
              spark(e.x, e.y, '#ef5350', 24, 50);
              floats.push({ x: e.x, y: e.y - 20, txt: '+' + (100 + combo * 20), life: 50, color: '#ffd54f' });
              beep(660, .12, 'square', .12);
            }
            break;
          }
        }
      } else if (!player.inv && dist2(b.x, b.y, player.x, player.y) < (player.r + b.r) ** 2) {
        if (player.shieldT > 0) { player.shieldT = 0; spark(player.x, player.y, '#4fc3f7', 16, 30); }
        else {
          player.hp -= 22;
          hurtFlash = 1;
          player.inv = 40;
          spark(player.x, player.y, '#ef5350', 14, 30);
          beep(180, .25, 'sawtooth', .14);
          if (player.hp <= 0) { /* game over handled elsewhere */ }
        }
        bullets.splice(i, 1);
      }
    }
  }
}

function updatePowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.life--;
    if (p.life <= 0) { powerups.splice(i, 1); continue; }
    if (dist2(p.x, p.y, player.x, player.y) < (p.r + player.r) ** 2) {
      if (p.type === 'heal') { player.hp = Math.min(100, player.hp + 40); floats.push({ x: player.x, y: player.y - 24, txt: '+40 生命', life: 60, color: '#ff7043' }); }
      else if (p.type === 'rapid') { player.rapidT = 480; floats.push({ x: player.x, y: player.y - 24, txt: '速射', life: 60, color: '#ffeb3b' }); }
      else if (p.type === 'triple') { player.triT = 600; floats.push({ x: player.x, y: player.y - 24, txt: '三连发', life: 60, color: '#ab47bc' }); }
      else if (p.type === 'shield') { player.shieldT = 480; floats.push({ x: player.x, y: player.y - 24, txt: '护盾', life: 60, color: '#4fc3f7' }); }
      else if (p.type === 'pierce') { player.pierceT = 360; floats.push({ x: player.x, y: player.y - 24, txt: '穿透', life: 60, color: '#ff7043' }); }
      powerups.splice(i, 1);
      beep(980, .12, 'sine', .13, 1400);
    }
  }
  if (spawnT > 0) spawnT -= 1/60;
  else if (Math.random() < 0.008 && powerups.length < 4) {
    const types = ['heal', 'rapid', 'triple', 'shield', 'pierce'];
    const type = types[Math.floor(Math.random() * types.length)];
    const colors = { heal: '#ff7043', rapid: '#ffeb3b', triple: '#ab47bc', shield: '#4fc3f7', pierce: '#ff8a65' };
    let x, y, tries = 0;
    do {
      x = rnd(HEDGE + 60, W - HEDGE - 60); y = rnd(HEDGE + 60, H - HEDGE - 60);
      tries++;
    } while (tries < 50 && (dist2(x, y, player.x, player.y) < 130 * 130));
    powerups.push({ x, y, r: 11, type, color: colors[type], life: 900 });
    spawnT = 8;
  }
}

function getMoveInput() {
  if (touchInput.active) return { x: touchInput.mx, y: touchInput.my, dash: touchInput.dashReq };
  let x = 0, y = 0;
  if (keys['w'] || keys['arrowup']) y--;
  if (keys['s'] || keys['arrowdown']) y++;
  if (keys['a'] || keys['arrowleft']) x--;
  if (keys['d'] || keys['arrowright']) x++;
  return { x, y, dash: keys['shift'] };
}
function getAimInput() {
  if (touchInput.active && touchInput.aimActive) return { x: touchInput.ax, y: touchInput.ay };
  return { x: mouse.x, y: mouse.y };
}
function getFireInput() {
  if (touchInput.active) return touchInput.fire;
  return mouse.down || keys[' '];
}

/* ---------- 联机：本地预测 + 插值渲染 ---------- */
function netStep() {
  if (!netMe) return;
  const inp = getMoveInput();
  const l = Math.hypot(inp.x, inp.y);
  if (l > 0.01) {
    netMe.x += inp.x / Math.max(l, 1) * 3.3;
    netMe.y += inp.y / Math.max(l, 1) * 3.3;
    pushOutOfMirrors(netMe);
  }
  netMe.aim = Math.atan2(touchInput.active ? touchInput.ay : mouse.y - netMe.y,
                          touchInput.active ? touchInput.ax : mouse.x - netMe.x);
  if (!(frameCount % 2)) {
    netSend({ t: 'input',
      mx: inp.x, my: inp.y,
      ax: (touchInput.active ? touchInput.ax : mouse.x) - netMe.x,
      ay: (touchInput.active ? touchInput.ay : mouse.y) - netMe.y,
      fire: getFireInput(), dash: inp.dash });
  }
}
function netApplySnapshot() {
  if (!snapCur) return;
  const meSnap = snapCur.ps && snapCur.ps.find(p => p.id === myId);
  if (meSnap && netMe) {
    const dx = meSnap.x - netMe.x, dy = meSnap.y - netMe.y;
    const d = Math.hypot(dx, dy);
    if (d > 24) { netMe.x = meSnap.x; netMe.y = meSnap.y; }
    else if (d > 1) { netMe.x += dx * .15; netMe.y += dy * .15; }
    netMe.hp = meSnap.hp; netMe.alive = !!meSnap.al;
    netMe.shield = !!meSnap.sh; netMe.triple = !!meSnap.tr; netMe.pierce = !!meSnap.pi;
    netMe.kills = meSnap.k; netMe.score = meSnap.s;
  }
  if (snapCur.ps) {
    for (const p of snapCur.ps) {
      if (p.id === myId) continue;
      let rp = netPlayers.get(p.id);
      if (!rp) {
        rp = { id: p.id, x: p.x, y: p.y, tx: p.x, ty: p.y, r: 14, aim: 0, alive: true, name: p.name, color: p.color };
        netPlayers.set(p.id, rp);
      }
      rp.tx = p.x; rp.ty = p.y; rp.alive = !!p.al; rp.hp = p.hp;
    }
  }
}

/* ---------- 绘制 ---------- */
function drawMirror(m) {
  ctx.strokeStyle = m.hp < 3 ? `rgba(144,164,174,${0.4 + m.hp * 0.2})` : '#90a4ae';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
}
function drawActor(o, color, label, opts) {
  opts = opts || {};
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(o.x, o.y + 10, o.r * .9, o.r * .35, 0, 0, 7); ctx.fill();
  if (opts.shield) {
    ctx.strokeStyle = 'rgba(79,195,247,.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 6, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.stroke();
  // 枪口方向
  const gx = o.x + Math.cos(o.aim) * (o.r + 6);
  const gy = o.y + Math.sin(o.aim) * (o.r + 6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(gx, gy); ctx.stroke();
  if (label) {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(label, o.x, o.y - o.r - 8);
  }
}
function drawAimLine() {
  if (!player) return;
  const pts = tracePath(player.x, player.y, Math.cos(player.aim), Math.sin(player.aim), 3);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
  const e = pts[pts.length - 1];
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.arc(e.x, e.y, 4, 0, 7); ctx.stroke();
}
function drawHud() {
  const me = mode === 'net' ? netMe : player;
  if (!me) return;
  const bw = 210, bh = 16, bx = 30, by = 30;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  roundRect(bx - 3, by - 3, bw + 6, bh + 6, 8); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#ef5350'); g.addColorStop(1, '#ff8a65');
  ctx.fillStyle = g;
  roundRect(bx, by, bw * clamp(me.hp / 100, 0, 1), bh, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
  roundRect(bx, by, bw, bh, 6); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('生命 ' + Math.max(0, me.hp | 0), bx + 8, by + bh - 4);

  if (mode === 'net') {
    ctx.textAlign = 'right'; ctx.font = 'bold 18px system-ui';
    const ktxt = '击杀 × ' + (me.kills || 0);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
    ctx.strokeText(ktxt, viewW - 30, 48);
    ctx.fillStyle = '#ffd54f'; ctx.fillText(ktxt, viewW - 30, 48);
    if (roundLeft > 0) {
      ctx.font = 'bold 15px system-ui';
      ctx.strokeText('剩余 ' + Math.ceil(roundLeft / 1000) + ' 秒', viewW - 30, 72);
      ctx.fillStyle = '#fff'; ctx.fillText('剩余 ' + Math.ceil(roundLeft / 1000) + ' 秒', viewW - 30, 72);
    }
    ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText('在线 ' + (snapCur ? (snapCur.ps ? snapCur.ps.length : '?') : '?') + ' 人', 30, 68);
  } else {
    ctx.textAlign = 'right'; ctx.font = 'bold 20px system-ui';
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
    const head = '第 ' + level + ' 关 · ' + kills + '/' + enemies.length + ' · ' + score + ' 分';
    ctx.strokeText(head, viewW - 30, 48);
    ctx.fillStyle = '#ffd54f'; ctx.fillText(head, viewW - 30, 48);
    if (combo > 1 && comboT > 0) {
      ctx.font = 'bold 16px system-ui';
      ctx.strokeText(combo + ' 连击', viewW - 30, 72);
      ctx.fillStyle = '#ff8a65'; ctx.fillText(combo + ' 连击', viewW - 30, 72);
    }
    ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui';
    ctx.strokeText('威胁等级 ' + threat + ' · 敌人 ' + enemies.filter(e => e.alive).length, 30, 68);
    ctx.fillStyle = threat >= 5 ? '#ef5350' : '#ffab91';
    ctx.fillText('威胁等级 ' + threat + ' · 敌人 ' + enemies.filter(e => e.alive).length, 30, 68);
  }
}
function drawCrosshair() {
  const me = mode === 'net' ? netMe : player;
  const cool = me ? (me.cool || 0) : 0;
  const c = cool > 0 ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.95)';
  ctx.strokeStyle = c; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
  ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 5);
  ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 15);
  ctx.stroke();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render() {
  // 屏幕底色
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2e3b2a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  // 世界坐标 + 镜头跟随
  applyCameraTransform();
  ctx.drawImage(ground, 0, 0, W, H);
  for (const m of mirrors) drawMirror(m);

  const inGame = state === 'playing' || state === 'paused' || state === 'countdown';
  if (inGame || state === 'results') {
    for (const p of powerups) {
      const pulse = 1 + .12 * Math.sin(performance.now() / 160 + p.x);
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 9, p.r * .9, p.r * .35, 0, 0, 7); ctx.fill();
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * pulse, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * pulse, 0, 7); ctx.stroke();
    }

    for (const b of bullets) {
      if (!b.trail) b.trail = [];
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 8) b.trail.shift();
      for (let i = 1; i < b.trail.length; i++) {
        const a = i / b.trail.length;
        ctx.strokeStyle = b.owner === 'p' || b.owner === myId ? `rgba(255,235,59,${a * .8})` : `rgba(255,138,128,${a * .8})`;
        ctx.lineWidth = b.r * 1.4 * a;
        ctx.beginPath();
        ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
        ctx.lineTo(b.trail[i].x, b.trail[i].y);
        ctx.stroke();
      }
      ctx.fillStyle = b.owner === 'p' || b.owner === myId ? '#ffeb3b' : '#ff8a80';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    }

    if (mode === 'net') {
      for (const rp of netPlayers.values()) {
        rp.x = lerp(rp.x, rp.tx, .25); rp.y = lerp(rp.y, rp.ty, .25);
        if (rp.alive) drawActor(rp, '#ef5350', rp.name || null);
        else {
          ctx.strokeStyle = 'rgba(239,83,80,.5)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(rp.x, rp.y, 12, 0, 7); ctx.stroke(); ctx.setLineDash([]);
        }
      }
      if (netMe) {
        if (netMe.alive) drawActor(netMe, '#42a5f5', null, { me: true, shield: netMe.shield });
        else {
          ctx.strokeStyle = 'rgba(66,165,245,.6)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(netMe.x, netMe.y, 12, 0, 7); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
          ctx.fillText('重生中……', netMe.x, netMe.y - 20);
        }
      }
    } else {
      if (player) drawAimLine();
      if (player) drawActor(player, player.inv > 0 && (player.inv >> 2) % 2 === 0 ? 'rgba(66,165,245,.4)' : '#42a5f5', '你', { me: true, shield: player.shieldT > 0 });
      for (const enemy of enemies) {
        if (enemy.alive) drawActor(enemy, enemy.hitT > 0 ? '#ffcdd2' : '#ef5350', '敌');
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of floats) {
      ctx.globalAlpha = clamp(f.life / 40, 0, 1);
      ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
      ctx.strokeText(f.txt, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    if (mode !== 'net' && state === 'playing') drawCrosshair();

    // UI 层：不受镜头影响（屏幕坐标 / 可视窗口坐标）
    const sx = window.__sx || 1, sy = window.__sy || 1;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);

    drawHud();
    // 触屏控件与 HUD 同一逻辑坐标系，保证竖屏/横屏都正确显示
    drawTouchUI();

    if (hurtFlash > 0) { ctx.fillStyle = `rgba(244,67,54,${hurtFlash * .28})`; ctx.fillRect(0, 0, viewW, viewH); }
    if (state === 'countdown') {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, viewW, viewH);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 72px system-ui'; ctx.textAlign = 'center';
      const n = Math.ceil(countdownLeft);
      ctx.fillText(String(n), viewW / 2, viewH / 2 + 20);
      ctx.font = 'bold 20px system-ui';
      ctx.fillText('对局即将开始……', viewW / 2, viewH / 2 + 70);
    }
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, viewW, viewH);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('已暂停 · 按 P 继续', viewW / 2, viewH / 2);
    }
  }
}

/* ---------- 触屏虚拟摇杆 ---------- */
const joyMove = { active: false, id: -1, cx: 0, cy: 0, dx: 0, dy: 0 };
const joyFire = { active: false, id: -1 };
function drawTouchUI() {
  // 始终在触屏设备上显示虚拟摇杆（逻辑坐标，与 HUD 一致）
  if (!isTouch && !touchInput.active) return;
  const sw = viewW, sh = viewH;
  const baseX = 90, baseY = sh - 90;
  if (joyMove.active) {
    const r = cv.getBoundingClientRect();
    const lx = (joyMove.cx / Math.max(r.width, 1)) * viewW;
    const ly = (joyMove.cy / Math.max(r.height, 1)) * viewH;
    ctx.globalAlpha = .28;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(lx, ly, 54, 0, 7); ctx.fill();
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#fff';
    const d = Math.min(Math.hypot(joyMove.dx, joyMove.dy), 42);
    const a = Math.atan2(joyMove.dy, joyMove.dx);
    ctx.beginPath(); ctx.arc(lx + Math.cos(a) * d, ly + Math.sin(a) * d, 24, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = .22;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(baseX, baseY, 54, 0, 7); ctx.fill();
    ctx.globalAlpha = .45;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(baseX, baseY, 24, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('移动', baseX, baseY + 48);
  }
  const fb = { x: sw - 90, y: sh - 90, r: 48 };
  ctx.globalAlpha = joyFire.active ? .6 : .32;
  ctx.fillStyle = joyFire.active ? '#ffeb3b' : '#000';
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('射击', fb.x, fb.y + 5);
  const db = { x: sw - 175, y: sh - 70, r: 34 };
  ctx.globalAlpha = .32; ctx.fillStyle = '#81d4fa';
  ctx.beginPath(); ctx.arc(db.x, db.y, db.r, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui';
  ctx.fillText('冲刺', db.x, db.y + 5);
}

function touchWorld(t) {
  return screenToWorld(t.clientX, t.clientY);
}
cv.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio();
  touchInput.active = true;
  for (const t of e.changedTouches) {
    const s = touchScreen(t);
    const w = touchWorld(t);
    if (s.x < s.rw / 2 && !joyMove.active) {
      joyMove.active = true; joyMove.id = t.identifier;
      joyMove.cx = s.x; joyMove.cy = s.y; joyMove.dx = 0; joyMove.dy = 0;
    } else {
      const fd = dist2(s.x, s.y, s.rw - 100, s.rh - 100);
      const dd = dist2(s.x, s.y, s.rw - 190, s.rh - 70);
      if (dd < 40 * 40 && !touchInput.dashReq) {
        touchInput.dashReq = true;
        setTimeout(() => touchInput.dashReq = false, 100);
        keys['shift'] = true;
        setTimeout(() => keys['shift'] = false, 60);
      } else if (fd < 70 * 70) {
        joyFire.active = true; joyFire.id = t.identifier;
        touchInput.fire = true; touchInput.aimActive = true;
        touchInput.ax = w.x; touchInput.ay = w.y;
      } else {
        touchInput.aimActive = true;
        touchInput.ax = w.x; touchInput.ay = w.y;
      }
    }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touchScreen(t);
    const w = touchWorld(t);
    if (joyMove.active && t.identifier === joyMove.id) {
      joyMove.dx = s.x - joyMove.cx; joyMove.dy = s.y - joyMove.cy;
      const l = Math.hypot(joyMove.dx, joyMove.dy) || 1;
      const cl = Math.min(l, 40) / 40;
      touchInput.mx = joyMove.dx / l * cl; touchInput.my = joyMove.dy / l * cl;
    } else if (joyFire.active && t.identifier === joyFire.id && touchInput.aimActive) {
      touchInput.ax = w.x; touchInput.ay = w.y;
    }
  }
  if (mode === 'net') autoAim();
}, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joyMove.active && t.identifier === joyMove.id) {
      joyMove.active = false; touchInput.mx = 0; touchInput.my = 0;
    }
    if (joyFire.active && t.identifier === joyFire.id) {
      joyFire.active = false; touchInput.fire = false; touchInput.aimActive = false;
    }
  }
}, { passive: false });
cv.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) {
    if (joyMove.active && t.identifier === joyMove.id) { joyMove.active = false; touchInput.mx = 0; touchInput.my = 0; }
    if (joyFire.active && t.identifier === joyFire.id) { joyFire.active = false; touchInput.fire = false; touchInput.aimActive = false; }
  }
}, { passive: false });

function autoAim() {
  let tx = null, ty = null, best = 1e9;
  if (mode === 'net') {
    for (const rp of netPlayers.values()) {
      if (!rp.alive) continue;
      const d = dist2(rp.x, rp.y, netMe.x, netMe.y);
      if (d < best) { best = d; tx = rp.x; ty = rp.y; }
    }
  } else {
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const d = dist2(enemy.x, enemy.y, player.x, player.y);
      if (d < best) { best = d; tx = enemy.x; ty = enemy.y; }
    }
  }
  if (tx !== null) { touchInput.ax = tx; touchInput.ay = ty; touchInput.aimActive = true; }
}

/* ---------- 主循环 ---------- */
let frameCount = 0;
function loop() {
  requestAnimationFrame(loop);
  frameCount++;
  if (state === 'countdown') {
    countdownLeft = Math.max(0, countdownLeft - 1 / 60);
    if (snapCur) netApplySnapshot();
    if (netMe) updateCamera(netMe.x, netMe.y);
    render();
    return;
  }
  if (state === 'playing') {
    if (mode === 'net') {
      netStep();
      netApplySnapshot();
      if (netMe) updateCamera(netMe.x, netMe.y);
    } else {
      surviveT += 1 / 60;
      if (graceT > 0) graceT -= 1 / 60;
      if (comboT > 0) { comboT -= 1 / 60; if (comboT <= 0) combo = 0; }
      score += 2;
      updatePlayerLocal();
      for (const e of enemies) updateEnemy(e);
      updateBullets();
      updatePowerups();
      for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
      particles = particles.filter(p => p.life > 0);
      for (const f of floats) f.life--;
      floats = floats.filter(f => f.life > 0);
      if (hurtFlash > 0) hurtFlash -= 0.04;
      if (player && player.hp <= 0) {
        state = 'results';
        document.getElementById('overTitle').textContent = '你被击败了';
        document.getElementById('overStat').innerHTML = '关卡 <span>' + level + '</span> · 击杀 <span>' + kills + '</span> · 得分 <span>' + score + '</span>';
        document.getElementById('over').classList.remove('hidden');
      } else if (enemies.every(e => !e.alive)) {
        completeLevel();
      }
      if (player) updateCamera(player.x, player.y);
    }
    render();
    return;
  }
  if (state === 'paused') {
    if (player) updateCamera(player.x, player.y);
    else if (netMe) updateCamera(netMe.x, netMe.y);
    render();
    return;
  }
  render();
}

/* ---------- 输入 ---------- */
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Shift') e.preventDefault();
  const k = e.key.toLowerCase();
  if (k === 'p' && (state === 'playing' || state === 'paused') && mode !== 'net') {
    state = state === 'playing' ? 'paused' : 'playing';
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', e => {
  if (touchInput.active) return;
  const w = screenToWorld(e.clientX, e.clientY);
  mouse.x = w.x; mouse.y = w.y;
});
cv.addEventListener('mousedown', e => { mouse.down = true; initAudio(); });
cv.addEventListener('mouseup', () => { mouse.down = false; });

/* ---------- 草地背景 ---------- */
const ground = document.createElement('canvas');
(function paintGround() {
  ground.width = W; ground.height = H;
  const g = ground.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#8dc63f'); grad.addColorStop(1, '#76b043');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) {
    const x = rnd(10, W - 10), y = rnd(10, H - 10);
    g.strokeStyle = `rgba(${46 + rnd(0, 30) | 0},${Math.random() < .5 ? 110 : 140},40,.35)`;
    g.lineWidth = 1.6;
    for (let j = 0; j < 3; j++) {
      g.beginPath();
      const bx = x + rnd(-4, 4);
      g.moveTo(bx, y);
      g.quadraticCurveTo(bx + rnd(-4, 4), y - 5, bx + rnd(-7, 7), y - rnd(7, 13));
      g.stroke();
    }
  }
  for (let i = 0; i < 90; i++) {
    const x = rnd(24, W - 24), y = rnd(24, H - 24);
    g.fillStyle = Math.random() < .5 ? '#fff6e0' : '#ffe082';
    for (let p = 0; p < 5; p++) {
      const a = p / 5 * Math.PI * 2;
      g.beginPath(); g.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2, 0, 7); g.fill();
    }
    g.fillStyle = '#ffb300'; g.beginPath(); g.arc(x, y, 1.8, 0, 7); g.fill();
  }
  g.fillStyle = '#33691e';
  g.fillRect(0, 0, W, HEDGE); g.fillRect(0, H - HEDGE, W, HEDGE);
  g.fillRect(0, 0, HEDGE, H); g.fillRect(W - HEDGE, 0, HEDGE, H);
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2;
  g.strokeRect(HEDGE, HEDGE, W - HEDGE * 2, H - HEDGE * 2);
})();

/* ---------- 启动 ---------- */
document.getElementById('btnSolo').onclick = () => {
  mode = 'solo';
  state = 'playing';
  document.getElementById('menu').classList.add('hidden');
  resetGame();
  initAudio();
};
document.getElementById('btnNet').onclick = () => {
  mode = 'net';
  state = 'lobby';
  document.getElementById('menu').classList.add('hidden');
  wsConnect();
  initAudio();
};
document.getElementById('btnAgain').onclick = () => {
  if (mode === 'solo') {
    document.getElementById('over').classList.add('hidden');
    resetGame();
    state = 'playing';
  } else {
    location.reload();
  }
};
document.getElementById('btnExit').onclick = () => {
  document.getElementById('over').classList.add('hidden');
  state = 'menu';
  mode = 'solo';
  document.getElementById('menu').classList.remove('hidden');
  if (typeof ws !== 'undefined' && ws && ws.readyState === 1) {
    try { ws.close(); } catch (e) {}
  }
};

fit();
loop();
</script>
